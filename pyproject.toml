[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bbb"
version = "0.1"
description = "Bilingual Book Builder"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fast-ebook>=0.2.0",
    "bs4>=0.0.2",
    "numpy>=2.4.6",
    # "numba>=0.65.1",
    # "faiss-gpu>=1.14.3",
    # "googletrans>=4.0.2",
    # "sentence-splitter>=1.4",
    # "sentence-transformers>=5.6.0",
]

[project.scripts]
bbb = "bbb.__main__:main"

[tool.setuptools.packages.find]
include = ["bbb*"]